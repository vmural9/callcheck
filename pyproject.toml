[project]
name = "callcheck"
version = "0.1.0"
description = "Evaluation harness for voice agents: simulated callers, recorded calls, a judge that shows its reasons"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishaal Muralidharan" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "soxr>=0.4",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35", "aws-sdk-bedrock-runtime[awscrt]>=0.12"]

[project.scripts]
callcheck = "callcheck.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callcheck"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: places real provider calls; needs credentials and CALLCHECK_LIVE=1"]
